<style>
  :root{
    --bg:#061018;
    --panel:#0e1c2c;
    --panel2:#132638;
    --line:#1f3a52;
    --text:#eaf4f6;
    --muted:#7fa0b0;
    --teal:#4fd8c4;
    --gold:#ffcf6b;
    --accent:#4fd8c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; background:radial-gradient(ellipse at 50% -10%, #0f2a3a 0%, var(--bg) 55%);
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    min-height:100vh; display:flex; flex-direction:column; align-items:center; padding:14px 10px 30px;
  }
  .wrap{width:100%; max-width:460px;}

  header{text-align:center; margin-bottom:8px;}
  header h1{font-size:1.28rem; margin:0 0 2px; font-weight:700;}
  header .biome{color:var(--accent); font-size:.85rem; font-weight:600;}
  header .goal{color:var(--muted); font-size:.72rem; margin-top:2px;}

  .stats{
    display:flex; justify-content:space-between; align-items:center;
    background:var(--panel); border:1px solid var(--line); border-radius:14px;
    padding:8px 14px; margin:6px 0;
  }
  .stat .label{font-size:.63rem; color:var(--muted); text-transform:uppercase; letter-spacing:.06em;}
  .stat .value{font-size:1rem; font-weight:700;}
  .stat .value.gold{color:var(--gold);}

  .tankwrap{
    background:linear-gradient(180deg, #0a3348 0%, #062231 55%, #041722 100%);
    border:1px solid var(--line); border-radius:16px;
    padding:6px; margin-bottom:10px; position:relative; overflow:hidden;
  }
  #tank{width:100%; height:210px; display:block; position:relative; z-index:2;}
  .fish{filter:drop-shadow(0 0 3px rgba(79,216,196,.45));}
  .feeder-line{stroke-dasharray:3 3;}
  .rays{position:absolute; inset:0; z-index:1; opacity:.12; pointer-events:none;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.5) 0 6px, transparent 6px 40px);
    animation:shimmer 7s linear infinite;}
  @keyframes shimmer{ from{background-position:0 0;} to{background-position:90px 50px;} }
  .bubbles{position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none;}
  .bubble{
    position:absolute; bottom:-20px; border-radius:50%;
    background:rgba(255,255,255,.28); pointer-events:none;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:.7;}
    100%{transform:translateY(-320px) translateX(var(--drift,10px)); opacity:0;}
  }

  .row{display:flex; gap:6px; margin-bottom:6px;}
  .btn{
    flex:1; padding:9px 6px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:.76rem; font-weight:600;
    text-align:center; cursor:pointer; line-height:1.2;
  }
  .btn.primary{background:linear-gradient(135deg, var(--teal), #2fa393); color:#04211c; border:none;}
  .btn.gold{background:linear-gradient(135deg, var(--gold), #c78e2e); color:#241a02; border:none;}
  .btn:disabled{opacity:.4;}
  .btn .sub{display:block; font-weight:500; font-size:.66rem; margin-top:2px; opacity:.85;}

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:7px 12px; margin-bottom:6px; font-size:.78rem; font-weight:600;
  }
  .switch{width:38px; height:22px; border-radius:11px; background:#2a3f55; position:relative; cursor:pointer;}
  .switch.on{background:var(--teal);}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on .knob{left:18px;}

  .section-title{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:8px 0 5px;}

  .fleet{display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:auto;}
  .fleetrow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:7px 11px;
  }
  .fleetrow .tag{display:flex; align-items:center; gap:8px; font-size:.8rem; font-weight:600; flex:1; min-width:0;}
  .swatch{width:14px; height:14px; border-radius:4px; flex-shrink:0;}
  .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fleetrow .count{color:var(--muted); font-weight:500; font-size:.72rem; white-space:nowrap;}
  .fleetrow button{
    border:none; border-radius:9px; padding:8px 10px; font-size:.72rem; font-weight:700;
    background:var(--gold); color:#241a02; white-space:nowrap;
  }
  .fleetrow button:disabled{background:#2a3557; color:var(--muted);}
  .empty{color:var(--muted); font-size:.8rem; text-align:center; padding:10px;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#241a02; padding:9px 16px; border-radius:10px;
    font-size:.82rem; font-weight:700; opacity:0; transition:opacity .3s, top .3s; pointer-events:none; z-index:20;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; top:26px;}

  .overlay{
    position:fixed; inset:0; background:rgba(3,8,14,.88); display:none;
    align-items:center; justify-content:center; z-index:30; padding:20px;
  }
  .overlay.show{display:flex;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px; text-align:center; max-width:360px;
  }
  .card h2{margin:0 0 8px; font-size:1.15rem;}
  .card p{color:var(--muted); font-size:.85rem; margin:4px 0;}
  .card .bonus{color:var(--gold); font-weight:700;}
  .card button{
    margin-top:16px; border:none; border-radius:12px; padding:12px 20px;
    background:linear-gradient(135deg, var(--teal), #2fa393); color:#04211c;
    font-weight:700; font-size:.9rem;
  }

  .footer{display:flex; justify-content:center; margin-top:14px;}
  .reset{font-size:.7rem; color:var(--muted); background:none; border:none; text-decoration:underline; padding:6px;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>AquaFusion <span style="font-size:.6em; color:var(--muted); font-weight:500;">— Bassin Sans Fin</span></h1>
    <div class="biome" id="biomeName">—</div>
    <div class="goal" id="goalText">—</div>
  </header>

  <div class="stats">
    <div class="stat"><div class="label">Perles 💠</div><div class="value gold" id="coinsVal">0</div></div>
    <div class="stat"><div class="label">Revenu / s</div><div class="value" id="incomeVal">0</div></div>
    <div class="stat"><div class="label">Poissons</div><div class="value" id="fishCountVal">0</div></div>
  </div>

  <div class="tankwrap">
    <div class="rays"></div>
    <div class="bubbles" id="bubbles"></div>
    <svg id="tank" viewBox="0 0 300 300"></svg>
  </div>

  <div class="row" id="buyRow"></div>
  <div class="row">
    <button class="btn" id="speedBtn">Courant +<span class="sub" id="speedCost"></span></button>
    <button class="btn" id="addFeederBtn">Nouvelle mangeoire<span class="sub" id="feederCost"></span></button>
  </div>
  <div class="row" id="checkpointBoostRow" style="display:none;">
    <button class="btn" id="feederBoostBtn">Enrichir les mangeoires<span class="sub" id="feederBoostCost"></span></button>
  </div>
  <div class="row" id="oxygenRow" style="display:none;">
    <button class="btn gold" id="oxygenBtn">Bulle d'oxygène</button>
  </div>
  <div class="toggle-row" id="autoFuseRow" style="display:none;">
    <span>Auto-nourrisseur (fusion automatique)</span>
    <div class="switch" id="autoFuseSwitch"><div class="knob"></div></div>
  </div>

  <div class="section-title">Poissons du bassin — fusion (3 identiques)</div>
  <div class="fleet" id="fleet"></div>

  <div class="footer">
    <button class="reset" id="resetBtn">Réinitialiser toute la progression</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<div class="overlay" id="overlay">
  <div class="card">
    <h2 id="overlayTitle">Bassin complété !</h2>
    <p id="overlaySub"></p>
    <p>Bonus permanent gagné : <span class="bonus" id="overlayBonus"></span></p>
    <button id="overlayBtn">Bassin suivant</button>
  </div>
</div>

<script>
const CX=150, CY=150, R_OUT=112, R_IN=70, R_MID=(112+70)/2;
const K = 6; // pacing global des revenus
const BASE_SPEED = 70; // degrés/seconde de base
const OFFLINE_CAP_SEC = 7200;

const FISH_NAMES = ['Guppy','Tétra néon','Poisson rouge','Danio zébré','Poisson clown','Poisson-ange',
  'Poisson-papillon','Poisson-chirurgien','Poisson-lion','Poisson-globe','Mérou','Barracuda',
  'Requin-corail','Poulpe','Raie manta','Créature abyssale légendaire'];

const BIOMES = [
  {name:'Bassin tropical', sides:0, accent:'#4fd8c4'},
  {name:'Récif corallien', sides:3, accent:'#ff6b81'},
  {name:'Mangrove', sides:4, accent:'#7ec850'},
  {name:'Forêt de kelp', sides:5, accent:'#3ddc97'},
  {name:'Pleine mer', sides:6, accent:'#2f7fe0'},
  {name:'Sources hydrothermales', sides:7, accent:'#ff8c42'},
  {name:'Polaire', sides:8, accent:'#bfe9f5'},
  {name:'Fosse abyssale', sides:9, accent:'#a06bff'},
];

let state = null;
let dirty = false;
let lastFrame = null;
let oxygenActiveUntil = 0;
let oxygenCooldownUntil = 0;

function defaultState(){
  return {
    bassinIndex: 1,
    coins: 0,
    fish: [ {tier:1, t:0, type:'normal'}, {tier:1, t:0.5, type:'normal'} ],
    fishBoughtCount: 2,
    speedLevel: 0,
    feederValueLevel: 0,
    feeders: [ {t:0} ],
    autoFuseOn: false,
    unlocked: { feederBoost:false, autoFuse:false, specialization:false, oxygen:false, schooling:false },
    prestige: { bassinsCompleted:0, revenueMult:1, costMult:1 },
    lastSave: Date.now(),
  };
}

function biomeFor(bassinIndex){
  const idx = bassinIndex-1;
  if (idx < BIOMES.length) return Object.assign({}, BIOMES[idx], {sides: BIOMES[idx].sides});
  const extra = idx - (BIOMES.length-1);
  const base = BIOMES[BIOMES.length-1];
  return { name: `Abysses mythiques ${extra}`, sides: 9+extra, accent: base.accent };
}

function fishName(t){
  if (t <= FISH_NAMES.length) return FISH_NAMES[t-1];
  return `Espèce légendaire n°${t-FISH_NAMES.length}`;
}
function tierValue(t){ return Math.pow(1.35, t-1); }
function fishHue(t){ return (170 + t*20) % 360; }
function fishColor(t){ return `hsl(${fishHue(t)} 70% 58%)`; }

function typeSpeedMult(type){ return type==='fast' ? 1.55 : type==='slow' ? 0.6 : 1; }
function typeValueMult(type){ return type==='fast' ? 0.6 : type==='slow' ? 1.65 : 1; }
function typeLabel(type){ return type==='fast' ? '⚡ rapide' : type==='slow' ? '🐢 lent' : ''; }

function fusionTarget(){ return 3 + state.bassinIndex; }

function angleSpeedBase(){
  const boosted = Date.now() < oxygenActiveUntil ? 2 : 1;
  return BASE_SPEED * (1 + state.speedLevel*0.2) * boosted;
}

function costFish(){ return Math.ceil(10 * Math.pow(1.15, state.fishBoughtCount) * state.prestige.costMult); }
function costSpeed(){ return Math.ceil(28 * Math.pow(1.45, state.speedLevel) * state.prestige.costMult); }
function costFeederBoost(){ return Math.ceil(45 * Math.pow(1.55, state.feederValueLevel) * state.prestige.costMult); }
function costNewFeeder(){ return Math.ceil(180 * Math.pow(2.2, state.feeders.length-1) * state.prestige.costMult); }
function costFuse(t){ return Math.ceil(14 * Math.pow(1.9, t-1) * state.prestige.costMult); }
function maxFish(){ return Math.min(30, 10 + state.bassinIndex*2); }
function maxFeeders(){ const b = biomeFor(state.bassinIndex); return b.sides===0 ? 8 : Math.min(12, b.sides*2); }

function feederValue(){ return (1 + state.feederValueLevel*0.3) * state.prestige.revenueMult; }

function checkUnlocks(){
  const u = state.unlocked;
  if (state.bassinIndex >= 2) u.feederBoost = true;
  if (state.bassinIndex >= 3) u.autoFuse = true;
  if (state.bassinIndex >= 4) u.specialization = true;
  if (state.bassinIndex >= 5) u.oxygen = true;
  if (state.bassinIndex >= 6) u.schooling = true;
}

function showToast(msg){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove('show'), 2600);
}

function fmt(n){
  if (n < 1000) return (Math.round(n*10)/10).toString();
  const units = ['k','M','G','T','P'];
  let u = -1;
  while (n >= 1000 && u < units.length-1){ n/=1000; u++; }
  return n.toFixed(n<10?2:1) + units[u];
}

// ---- geometry ----
function polygonVertices(sides, radius, rotationDeg){
  const pts = [];
  for (let i=0;i<sides;i++){
    const a = (rotationDeg + i*(360/sides) - 90) * Math.PI/180;
    pts.push({x: CX+radius*Math.cos(a), y: CY+radius*Math.sin(a)});
  }
  return pts;
}
function positionAtT(t, sides, radius, rotationDeg){
  t = ((t % 1)+1)%1;
  if (sides === 0){
    const angle = t*360;
    const rad = (angle-90)*Math.PI/180;
    return { x: CX+radius*Math.cos(rad), y: CY+radius*Math.sin(rad), heading: angle };
  }
  const verts = polygonVertices(sides, radius, rotationDeg);
  const seg = t*sides;
  const i = Math.floor(seg) % sides;
  const u = seg - Math.floor(seg);
  const p0 = verts[i], p1 = verts[(i+1)%sides];
  const x = p0.x + (p1.x-p0.x)*u;
  const y = p0.y + (p1.y-p0.y)*u;
  const heading = Math.atan2(p1.y-p0.y, p1.x-p0.x) * 180/Math.PI;
  return { x, y, heading };
}
function pointsAttr(sides, radius, rotationDeg){
  if (sides === 0) return null;
  return polygonVertices(sides, radius, rotationDeg).map(p=>`${p.x},${p.y}`).join(' ');
}

function crossedT(prev, next, target){
  if (next >= prev) return target > prev && target <= next;
  return target > prev || target <= next;
}

// ---- simulation ----
function simulate(dt){
  const spdBase = angleSpeedBase()/360; // fraction de tour / seconde de base
  const crossingsThisTick = {};
  for (const f of state.fish){
    const prev = f.t;
    const spd = spdBase * typeSpeedMult(f.type);
    let next = (prev + spd*dt) % 1;
    for (let fi=0; fi<state.feeders.length; fi++){
      if (crossedT(prev, next, state.feeders[fi].t)){
        if (!crossingsThisTick[fi]) crossingsThisTick[fi] = [];
        crossingsThisTick[fi].push(f);
      }
    }
    f.t = next;
  }
  let earned = 0;
  const biome = biomeFor(state.bassinIndex);
  for (const fi in crossingsThisTick){
    const group = crossingsThisTick[fi];
    const schoolBonus = state.unlocked.schooling && group.length > 1 ? (1 + 0.25*(group.length-1)) : 1;
    let groupEarned = 0;
    for (const f of group){
      groupEarned += tierValue(f.tier) * typeValueMult(f.type) * feederValue() * K * schoolBonus;
    }
    earned += groupEarned;
    const feeder = state.feeders[fi];
    if (feeder){
      const p = positionAtT(feeder.t, biome.sides, R_OUT+12, 0);
      spawnPopup(p.x, p.y, groupEarned);
      spawnRipple(p.x, p.y, biome.accent);
    }
  }
  if (earned > 0) state.coins += earned;
}

function spawnRipple(x, y, color){
  const layer = document.getElementById('popupLayer');
  if (!layer) return;
  const el = document.createElementNS('http://www.w3.org/2000/svg','circle');
  el.setAttribute('cx', x);
  el.setAttribute('cy', y);
  el.setAttribute('r', 5);
  el.setAttribute('fill', 'none');
  el.setAttribute('stroke', color);
  el.setAttribute('stroke-width', 2);
  layer.appendChild(el);
  el.animate(
    [ {r:'5', opacity:1}, {r:'20', opacity:0} ],
    { duration: 500, easing: 'ease-out' }
  );
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
}

function spawnPopup(x, y, amount){
  const layer = document.getElementById('popupLayer');
  if (!layer) return;
  const el = document.createElementNS('http://www.w3.org/2000/svg','text');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('fill', '#ffcf6b');
  el.setAttribute('font-size', '11');
  el.setAttribute('font-weight', '700');
  el.setAttribute('text-anchor', 'middle');
  el.textContent = '+' + fmt(amount) + ' 💠';
  layer.appendChild(el);
  el.animate(
    [ {transform:'translateY(0px)', opacity:1}, {transform:'translateY(-26px)', opacity:0} ],
    { duration: 900, easing: 'ease-out' }
  );
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 920);
}

function estIncomePerSec(){
  const loopsPerSec = angleSpeedBase()/360;
  const feedSum = state.feeders.length * feederValue();
  const fishSum = state.fish.reduce((s,f)=> s + tierValue(f.tier)*typeValueMult(f.type)*typeSpeedMult(f.type), 0);
  return loopsPerSec * feedSum * fishSum * K;
}

// ---- rendering ----
function buildTankStatic(){
  const biome = biomeFor(state.bassinIndex);
  const svg = document.getElementById('tank');
  let html = `<g opacity="0.55">
    <path d="M20,290 Q14,258 25,233 Q9,212 22,186" stroke="#2fae6b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M36,296 Q30,268 41,243 Q27,222 39,198" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M276,293 Q282,264 269,239 Q284,216 270,192" stroke="#2fae6b" stroke-width="4" fill="none" stroke-linecap="round"/>
    <circle cx="257" cy="34" r="10" fill="#ff8c6b" opacity="0.75"/>
    <circle cx="270" cy="27" r="6" fill="#ff6b81" opacity="0.75"/>
    <circle cx="30" cy="31" r="8" fill="#ffb26b" opacity="0.75"/>
  </g>`;
  if (biome.sides === 0){
    html += `<circle cx="${CX}" cy="${CY}" r="${R_OUT}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
    html += `<circle cx="${CX}" cy="${CY}" r="${R_IN}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
  } else {
    html += `<polygon points="${pointsAttr(biome.sides,R_OUT,0)}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
    html += `<polygon points="${pointsAttr(biome.sides,R_IN,0)}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
  }
  state.feeders.forEach((fdr) => {
    const pIn = positionAtT(fdr.t, biome.sides, R_IN, 0);
    const pOut = positionAtT(fdr.t, biome.sides, R_OUT, 0);
    html += `<line class="feeder-line" x1="${pIn.x}" y1="${pIn.y}" x2="${pOut.x}" y2="${pOut.y}" stroke="${biome.accent}" stroke-width="1.5" opacity="0.7"/>`;
    const mid = positionAtT(fdr.t, biome.sides, R_OUT+12, 0);
    html += `<g>
      <circle cx="${mid.x}" cy="${mid.y}" r="5" fill="${biome.accent}" opacity="0.9"/>
      <circle cx="${mid.x-4}" cy="${mid.y+3}" r="2" fill="${biome.accent}" opacity="0.6"/>
      <circle cx="${mid.x+4}" cy="${mid.y-2}" r="2" fill="${biome.accent}" opacity="0.6"/>
    </g>`;
  });
  html += `<g id="fishLayer"></g><g id="popupLayer"></g>`;
  svg.innerHTML = html;
  buildFishLayer();
}

function buildFishLayer(){
  const layer = document.getElementById('fishLayer');
  layer.innerHTML = '';
  state.fish.forEach((f, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id','fish'+i);
    g.setAttribute('class','fish');
    const size = 6 + Math.min(7, f.tier*0.5);
    const c = fishColor(f.tier);
    g.innerHTML = `
      <path d="M ${-size*1.6},0 C ${-size*1.6},${-size*0.95} ${size*0.55},${-size*0.95} ${size*1.15},0 C ${size*0.55},${size*0.95} ${-size*1.6},${size*0.95} ${-size*1.6},0 Z" fill="${c}"/>
      <polygon points="${-size*0.3},${-size*0.85} ${size*0.15},${-size*1.35} ${size*0.35},${-size*0.75}" fill="${c}" opacity="0.9"/>
      <g transform="translate(${-size*1.55},0)">
        <polygon points="0,0 ${-size*0.9},${-size*0.65} ${-size*0.9},${size*0.65}" fill="${c}">
          <animateTransform attributeName="transform" type="rotate" values="-16 0 0;16 0 0;-16 0 0" dur="0.55s" repeatCount="indefinite"/>
        </polygon>
      </g>
      <ellipse cx="${size*0.1}" cy="${-size*0.35}" rx="${size*0.5}" ry="${size*0.22}" fill="#ffffff" opacity="0.22"/>
      <circle cx="${size*0.65}" cy="${-size*0.12}" r="${Math.max(1,size*0.13)}" fill="#04211c"/>
    `;
    layer.appendChild(g);
  });
  positionFish();
}

function positionFish(){
  const biome = biomeFor(state.bassinIndex);
  state.fish.forEach((f,i) => {
    const el = document.getElementById('fish'+i);
    if (!el) return;
    const p = positionAtT(f.t, biome.sides, R_MID, 0);
    el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${p.heading})`);
  });
}

function render(){
  const biome = biomeFor(state.bassinIndex);
  document.getElementById('biomeName').textContent = `Bassin ${state.bassinIndex} — ${biome.name}`;
  document.getElementById('goalText').textContent = `Objectif : faire évoluer un poisson jusqu'au palier ${fusionTarget()} (${fishName(fusionTarget())})`;
  document.getElementById('coinsVal').textContent = fmt(state.coins);
  document.getElementById('incomeVal').textContent = fmt(estIncomePerSec());
  document.getElementById('fishCountVal').textContent = `${state.fish.length}/${maxFish()}`;

  renderBuyRow();

  const speedBtn = document.getElementById('speedBtn');
  speedBtn.disabled = state.coins < costSpeed();
  document.getElementById('speedCost').textContent = fmt(costSpeed())+' 💠';

  const feederBtn = document.getElementById('addFeederBtn');
  const feedersMaxed = state.feeders.length >= maxFeeders();
  feederBtn.disabled = state.coins < costNewFeeder() || feedersMaxed;
  document.getElementById('feederCost').textContent = feedersMaxed ? 'Max' : fmt(costNewFeeder())+' 💠';

  document.getElementById('checkpointBoostRow').style.display = state.unlocked.feederBoost ? 'flex' : 'none';
  if (state.unlocked.feederBoost){
    const b = document.getElementById('feederBoostBtn');
    b.disabled = state.coins < costFeederBoost();
    document.getElementById('feederBoostCost').textContent = fmt(costFeederBoost())+' 💠';
  }

  document.getElementById('oxygenRow').style.display = state.unlocked.oxygen ? 'flex' : 'none';
  if (state.unlocked.oxygen){
    const ob = document.getElementById('oxygenBtn');
    const onCooldown = Date.now() < oxygenCooldownUntil;
    ob.disabled = onCooldown;
    ob.textContent = onCooldown ? `Recharge... ${Math.ceil((oxygenCooldownUntil-Date.now())/1000)}s` : "Bulle d'oxygène (x2 vitesse, 8s)";
  }

  document.getElementById('autoFuseRow').style.display = state.unlocked.autoFuse ? 'flex' : 'none';
  document.getElementById('autoFuseSwitch').classList.toggle('on', !!state.autoFuseOn);

  renderFleet();
}

function renderBuyRow(){
  const row = document.getElementById('buyRow');
  row.innerHTML = '';
  const atCap = state.fish.length >= maxFish();
  const c = costFish();
  if (!state.unlocked.specialization){
    row.innerHTML = `<button class="btn primary" id="buyNormalBtn">Nouveau poisson<span class="sub">${atCap?'Bassin plein':fmt(c)+' 💠'}</span></button>`;
    document.getElementById('buyNormalBtn').disabled = state.coins < c || atCap;
    document.getElementById('buyNormalBtn').onclick = () => buyFish('normal');
  } else {
    row.innerHTML = `
      <button class="btn primary" id="buyFastBtn">⚡ Poisson rapide<span class="sub">${atCap?'Plein':fmt(c)+' 💠'}</span></button>
      <button class="btn primary" id="buySlowBtn">🐢 Poisson lent<span class="sub">${atCap?'Plein':fmt(c)+' 💠'}</span></button>
    `;
    document.getElementById('buyFastBtn').disabled = state.coins < c || atCap;
    document.getElementById('buySlowBtn').disabled = state.coins < c || atCap;
    document.getElementById('buyFastBtn').onclick = () => buyFish('fast');
    document.getElementById('buySlowBtn').onclick = () => buyFish('slow');
  }
}

function renderFleet(){
  const groups = {};
  for (const f of state.fish){
    const key = f.tier+'_'+f.type;
    if (!groups[key]) groups[key] = { tier:f.tier, type:f.type, count:0 };
    groups[key].count++;
  }
  const keys = Object.keys(groups).sort((a,b)=> groups[a].tier - groups[b].tier);
  const wrap = document.getElementById('fleet');
  wrap.innerHTML = '';
  if (keys.length === 0){
    wrap.innerHTML = '<div class="empty">Aucun poisson</div>';
    return;
  }
  for (const k of keys){
    const g = groups[k];
    const c = costFuse(g.tier);
    const row = document.createElement('div');
    row.className = 'fleetrow';
    row.innerHTML = `
      <div class="tag"><span class="swatch" style="background:${fishColor(g.tier)}"></span><span class="fname">${fishName(g.tier)} ${typeLabel(g.type)}</span></div>
      <div class="count">${g.count}</div>
      <button ${g.count<3 || state.coins<c ? 'disabled':''}>${g.count<3 ? 'x'+g.count : fmt(c)+' 💠'}</button>
    `;
    row.querySelector('button').onclick = () => fuseGroup(g.tier, g.type);
    wrap.appendChild(row);
  }
}

// ---- actions ----
function buyFish(type){
  if (state.fish.length >= maxFish()) return;
  const c = costFish();
  if (state.coins < c) return;
  state.coins -= c;
  state.fishBoughtCount++;
  state.fish.push({tier:1, t: Math.random(), type: state.unlocked.specialization ? type : 'normal'});
  dirty = true;
  buildTankStatic();
  render();
}

function buySpeed(){
  const c = costSpeed();
  if (state.coins < c) return;
  state.coins -= c;
  state.speedLevel++;
  dirty = true;
  render();
}

function buyFeederBoost(){
  const c = costFeederBoost();
  if (state.coins < c) return;
  state.coins -= c;
  state.feederValueLevel++;
  dirty = true;
  render();
}

function addFeeder(){
  if (state.feeders.length >= maxFeeders()) return;
  const c = costNewFeeder();
  if (state.coins < c) return;
  state.coins -= c;
  const ts = state.feeders.map(f=>f.t).sort((a,b)=>a-b);
  const all = ts.concat([ts[0]+1]);
  let bestGap = -1, bestMid = 0;
  for (let i=1;i<all.length;i++){
    const gap = all[i]-all[i-1];
    if (gap > bestGap){ bestGap = gap; bestMid = (all[i-1]+all[i])/2; }
  }
  state.feeders.push({t: bestMid % 1});
  dirty = true;
  buildTankStatic();
  render();
}

function fuseGroup(tier, type){
  const idxs = [];
  for (let i=0;i<state.fish.length && idxs.length<3;i++){
    if (state.fish[i].tier===tier && state.fish[i].type===type) idxs.push(i);
  }
  if (idxs.length < 3) return false;
  const c = costFuse(tier);
  if (state.coins < c) return false;
  state.coins -= c;
  const avgT = idxs.reduce((s,i)=>s+state.fish[i].t,0)/idxs.length;
  state.fish = state.fish.filter((_,i)=>!idxs.includes(i));
  const newTier = tier+1;
  state.fish.push({tier:newTier, t:avgT, type});
  dirty = true;
  if (newTier >= fusionTarget()){
    completeBassin();
  } else {
    buildTankStatic();
    render();
  }
  return true;
}

function autoFuseTick(){
  if (!state.autoFuseOn || !state.unlocked.autoFuse) return;
  const groups = {};
  for (const f of state.fish){
    const key = f.tier+'_'+f.type;
    if (!groups[key]) groups[key] = { tier:f.tier, type:f.type, count:0 };
    groups[key].count++;
  }
  const keys = Object.keys(groups).sort((a,b)=> groups[a].tier - groups[b].tier);
  for (const k of keys){
    const g = groups[k];
    if (g.count >= 3 && state.coins >= costFuse(g.tier)){
      fuseGroup(g.tier, g.type);
      break; // une seule fusion auto par tick pour rester lisible
    }
  }
}

function useOxygen(){
  if (Date.now() < oxygenCooldownUntil) return;
  oxygenActiveUntil = Date.now() + 8000;
  oxygenCooldownUntil = Date.now() + 30000;
  showToast("Bulle d'oxygène activée !");
  render();
}

function completeBassin(){
  state.prestige.bassinsCompleted++;
  state.prestige.revenueMult = 1 + 0.1*state.prestige.bassinsCompleted;
  state.prestige.costMult = Math.max(0.5, 1 - 0.03*state.prestige.bassinsCompleted);
  document.getElementById('overlayTitle').textContent = 'Bassin complété !';
  document.getElementById('overlaySub').textContent = `Vous passez au bassin ${state.bassinIndex+1}.`;
  document.getElementById('overlayBonus').textContent = `Revenu global x${state.prestige.revenueMult.toFixed(2)}, coûts x${state.prestige.costMult.toFixed(2)}`;
  document.getElementById('overlay').classList.add('show');
  saveState();
}

function startNewBassin(){
  state.bassinIndex++;
  state.coins = 0;
  state.fish = [ {tier:1, t:0, type:'normal'}, {tier:1, t:0.5, type:'normal'} ];
  state.fishBoughtCount = 2;
  state.speedLevel = 0;
  state.feederValueLevel = 0;
  state.feeders = [ {t:0} ];
  checkUnlocks();
  document.getElementById('overlay').classList.remove('show');
  dirty = true;
  buildTankStatic();
  render();
  saveState();
}

// ---- loop / persistence ----
function loop(ts){
  if (lastFrame === null) lastFrame = ts;
  let dt = (ts-lastFrame)/1000;
  dt = Math.min(dt, 0.25);
  lastFrame = ts;
  simulate(dt);
  positionFish();
  requestAnimationFrame(loop);
}

let tickCounter = 0;
function uiTick(){
  tickCounter++;
  autoFuseTick();
  render();
  dirty = true;
  if (tickCounter % 3 === 0){ saveState(); }
}

async function storageSet(key, value){
  try{
    if (window.storage && window.storage.set){
      const r = await window.storage.set(key, value, false);
      if (r) return true;
    }
  }catch(err){ /* pas d'accès à window.storage ici, on bascule sur localStorage */ }
  try{ localStorage.setItem(key, value); return true; }catch(err){ return false; }
}

async function storageGet(key){
  try{
    if (window.storage && window.storage.get){
      const r = await window.storage.get(key, false);
      if (r && r.value) return r.value;
    }
  }catch(err){ /* pas d'accès à window.storage ici, on bascule sur localStorage */ }
  try{ return localStorage.getItem(key); }catch(err){ return null; }
}

async function saveState(){
  state.lastSave = Date.now();
  await storageSet('aquarium-idle-save', JSON.stringify(state));
}

async function loadState(){
  try{
    const raw = await storageGet('aquarium-idle-save');
    if (raw){
      const loaded = JSON.parse(raw);
      state = Object.assign(defaultState(), loaded);
      state.unlocked = Object.assign(defaultState().unlocked, loaded.unlocked||{});
      state.prestige = Object.assign(defaultState().prestige, loaded.prestige||{});
      const elapsedSec = Math.max(0, Math.min(OFFLINE_CAP_SEC, (Date.now()-(loaded.lastSave||Date.now()))/1000));
      if (elapsedSec > 5){
        const earned = estIncomePerSec()*elapsedSec;
        state.coins += earned;
        showToast(`Pendant votre absence : +${fmt(earned)} 💠`);
      }
    } else {
      state = defaultState();
    }
  }catch(err){
    state = defaultState();
  }
  checkUnlocks();
}

function spawnBubbles(){
  const container = document.getElementById('bubbles');
  container.innerHTML = '';
  for (let i=0;i<10;i++){
    const b = document.createElement('div');
    b.className = 'bubble';
    const size = 3 + Math.random()*6;
    b.style.width = size+'px';
    b.style.height = size+'px';
    b.style.left = (Math.random()*100)+'%';
    b.style.setProperty('--drift', (Math.random()*30-15)+'px');
    b.style.animationDuration = (4+Math.random()*5)+'s';
    b.style.animationDelay = (Math.random()*6)+'s';
    container.appendChild(b);
  }
}

async function init(){
  await loadState();
  buildTankStatic();
  spawnBubbles();
  render();

  document.getElementById('speedBtn').onclick = buySpeed;
  document.getElementById('addFeederBtn').onclick = addFeeder;
  document.getElementById('feederBoostBtn').onclick = buyFeederBoost;
  document.getElementById('oxygenBtn').onclick = useOxygen;
  document.getElementById('autoFuseSwitch').onclick = () => {
    state.autoFuseOn = !state.autoFuseOn;
    dirty = true;
    render();
  };
  document.getElementById('overlayBtn').onclick = startNewBassin;
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Réinitialiser toute la progression, y compris les bonus de prestige ?')){
      state = defaultState();
      dirty = true;
      buildTankStatic();
      render();
      saveState();
    }
  };

  requestAnimationFrame(loop);
  setInterval(uiTick, 1000);
}

init();
</script>
</body>
</html>
