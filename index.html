<style>
  :root{
    --bg:#061018;
    --panel:rgba(14,28,44,.62);
    --panel2:rgba(19,38,56,.62);
    --line:#1f3a52;
    --text:#eaf4f6;
    --muted:#9fb6c4;
    --teal:#4fd8c4;
    --gold:#ffcf6b;
    --accent:#4fd8c4;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent; user-select:none;}
  html,body{height:100%;}
  body{
    margin:0; background:#04070c;
    color:var(--text); font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    overflow:hidden;
  }
  .aquarium-bg{position:fixed; inset:0; z-index:0; overflow:hidden;
    background:linear-gradient(180deg, #0a3348 0%, #062231 55%, #041722 100%);}
  .aquarium-bg::before{
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 80% 40% at 50% 0%, rgba(180,230,255,.16) 0%, transparent 60%);
  }
  .aquarium-bg::after{
    content:''; position:absolute; inset:0; z-index:1; pointer-events:none;
    background:radial-gradient(ellipse 90% 90% at 50% 50%, transparent 55%, rgba(0,4,8,.45) 100%);
  }
  #tank{width:100%; height:100%; display:block;}

  .waterline{
    position:absolute; top:0; left:0; right:0; height:34px; z-index:1; pointer-events:none;
    background:linear-gradient(180deg, rgba(210,240,255,.28) 0%, rgba(210,240,255,.08) 55%, transparent 100%);
    border-bottom:1px solid rgba(210,240,255,.35);
  }

  .tankFrame{
    position:fixed; inset:0; z-index:5; pointer-events:none;
    border:12px solid #1b1f26;
    border-image:linear-gradient(160deg, #454b54, #14171b 45%, #2a2e35 60%, #08090b) 1;
    box-shadow:
      inset 0 0 0 2px rgba(255,255,255,.07),
      inset 0 0 28px rgba(0,0,0,.55);
  }
  .rivet{
    position:absolute; width:9px; height:9px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #8a919c, #2c2f35 70%);
    box-shadow:0 1px 2px rgba(0,0,0,.6);
  }

  .hud-top{
    position:fixed; top:34px; left:16px; right:16px; z-index:2;
    max-width:428px; margin:0 auto;
    padding:9px 12px 8px;
    background:linear-gradient(180deg, #2a323b 0%, #1a2027 100%);
    border:1px solid #0a0e12; border-radius:9px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.08), 0 3px 8px rgba(0,0,0,.4);
    text-shadow:none;
  }
  .hud-titlerow{display:flex; align-items:center; justify-content:space-between; margin-bottom:6px;}
  .hud-title{font-size:.86rem; font-weight:700; color:var(--accent); letter-spacing:.03em;}
  .iconBtn{
    background:linear-gradient(180deg, #2f3947 0%, #1c232c 100%); border:1px solid #0a0e12; border-radius:8px;
    font-size:1rem; padding:5px 9px;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.1);
  }
  .hud-pills{display:flex; gap:6px; margin-bottom:6px;}
  .pill{
    background:#0d1116; border:1px solid #232b34; border-radius:6px;
    padding:4px 10px; font-size:.78rem; font-weight:700; color:#8fe8d8;
    font-family:'Courier New', monospace; letter-spacing:.02em;
    box-shadow:inset 0 1px 3px rgba(0,0,0,.6);
  }
  .pill.gold{color:var(--gold);}
  .hud-line{font-size:.68rem; color:var(--text); opacity:.85; margin-top:2px;
    overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .hud-line.muted{color:var(--muted); text-decoration:underline dotted; text-underline-offset:2px;}

  .actionGrid{
    position:fixed; left:50%; bottom:0; transform:translateX(-50%); z-index:2;
    width:100%; max-width:444px; box-sizing:border-box;
    display:grid; grid-template-columns:1fr 1fr; gap:5px;
    padding:6px 16px calc(16px + env(safe-area-inset-bottom));
    background:linear-gradient(0deg, rgba(4,7,12,.75) 40%, rgba(4,7,12,0) 100%);
  }
  .abtn{
    background:linear-gradient(180deg, #223347 0%, #16222f 100%);
    border:1px solid #0a121a; border-radius:8px;
    color:var(--text); font-size:.72rem; font-weight:600; padding:7px 6px 7px 16px;
    text-align:center; line-height:1.2;
    box-shadow:inset 0 1px 0 rgba(255,255,255,.12), inset 0 -2px 3px rgba(0,0,0,.4);
  }
  .abtn.primary{background:linear-gradient(180deg, #5fe4cf 0%, #2a8f7e 100%); color:#04211c; border-color:#0a3d34;}
  .abtn.gold{background:linear-gradient(180deg, #ffdd8a 0%, #c78e2e 100%); color:#241a02; border-color:#5c3f0f; grid-column:1/-1;}
  .abtn:disabled{opacity:.4;}
  .abtn .sub{display:block; font-weight:500; font-size:.64rem; margin-top:1px; opacity:.85;}
  .abtn{position:relative;}
  .abtn::before{
    content:''; position:absolute; top:50%; left:6px; transform:translateY(-50%);
    width:6px; height:6px; border-radius:50%;
    background:#3a4a5a; box-shadow:inset 0 0 1px rgba(0,0,0,.6);
  }
  .abtn:not(:disabled)::before{ background:#5fffcf; box-shadow:0 0 4px #5fffcf, 0 0 8px #5fffcf; }
  .infoDot{
    position:absolute; top:2px; right:2px; width:15px; height:15px; border-radius:50%;
    background:rgba(255,255,255,.18); color:inherit; font-size:.6rem; line-height:15px;
    text-align:center;
  }

  .fish{filter:drop-shadow(0 0 3px rgba(79,216,196,.45));}
  .fish.golden{
    filter:drop-shadow(0 0 6px #ffd700) drop-shadow(0 0 12px #ffae00);
    animation:goldenPulse .7s ease-in-out infinite;
  }
  @keyframes goldenPulse{
    0%,100%{ opacity:1; }
    50%{ opacity:.6; }
  }
  .fishSway{ animation-name:fishSway; animation-timing-function:ease-in-out; animation-iteration-count:infinite; transform-box:fill-box; transform-origin:50% 50%; }
  @keyframes fishSway{
    0%,100%{ transform:rotate(-4deg); }
    50%{ transform:rotate(4deg); }
  }
  .feeder-line{stroke-dasharray:3 3;}
  .feederGlow{animation:feederPulse 2.6s ease-in-out infinite; transform-box:fill-box; transform-origin:50% 50%;}
  @keyframes feederPulse{
    0%,100%{ opacity:1; transform:scale(1); }
    50%{ opacity:.75; transform:scale(1.12); }
  }
  .rays{position:absolute; inset:0; z-index:1; opacity:.12; pointer-events:none;
    background:repeating-linear-gradient(100deg, rgba(255,255,255,.5) 0 6px, transparent 6px 40px);
    animation:shimmer 7s linear infinite;}
  @keyframes shimmer{ from{background-position:0 0;} to{background-position:90px 50px;} }
  .bubbles{position:absolute; inset:0; z-index:1; overflow:hidden; pointer-events:none;}
  .bubble{
    position:absolute; bottom:-20px; border-radius:50%;
    background:rgba(255,255,255,.28); pointer-events:none;
    animation:rise linear infinite;
  }
  @keyframes rise{
    0%{transform:translateY(0) translateX(0); opacity:.7;}
    100%{transform:translateY(-320px) translateX(var(--drift,10px)); opacity:0;}
  }

  .row{display:flex; gap:6px; margin-bottom:6px;}
  .btn, .toggle-row, .fleetrow, .questbar, .card{
    backdrop-filter:blur(10px); -webkit-backdrop-filter:blur(10px);
  }
  .btn{
    flex:1; padding:9px 6px; border-radius:11px; border:1px solid var(--line);
    background:var(--panel2); color:var(--text); font-size:.76rem; font-weight:600;
    text-align:center; cursor:pointer; line-height:1.2;
  }
  .btn.primary{background:linear-gradient(135deg, var(--teal), #2fa393); color:#04211c; border:none;}
  .btn.gold{background:linear-gradient(135deg, var(--gold), #c78e2e); color:#241a02; border:none;}
  .btn:disabled{opacity:.4;}
  .btn .sub{display:block; font-weight:500; font-size:.66rem; margin-top:2px; opacity:.85;}

  .toggle-row{
    display:flex; align-items:center; justify-content:space-between;
    background:var(--panel); border:1px solid var(--line); border-radius:11px;
    padding:7px 12px; margin-bottom:6px; font-size:.78rem; font-weight:600;
  }
  .switch{width:38px; height:22px; border-radius:11px; background:#2a3f55; position:relative; cursor:pointer;}
  .switch.on{background:var(--teal);}
  .switch .knob{position:absolute; top:2px; left:2px; width:18px; height:18px; border-radius:50%; background:#fff; transition:left .15s;}
  .switch.on .knob{left:18px;}

  .section-title{font-size:.68rem; color:var(--muted); text-transform:uppercase; letter-spacing:.08em; margin:8px 0 5px;}

  .fleet{display:flex; flex-direction:column; gap:6px; max-height:150px; overflow-y:auto;}
  .fleetrow{
    display:flex; align-items:center; justify-content:space-between; gap:8px;
    background:var(--panel); border:1px solid var(--line); border-radius:11px; padding:7px 11px;
  }
  .fleetrow .tag{display:flex; align-items:center; gap:8px; font-size:.8rem; font-weight:600; flex:1; min-width:0;}
  .swatch{width:14px; height:14px; border-radius:4px; flex-shrink:0;}
  .fname{overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
  .fleetrow .count{color:var(--muted); font-weight:500; font-size:.72rem; white-space:nowrap;}
  .fleetrow button{
    border:none; border-radius:9px; padding:8px 10px; font-size:.72rem; font-weight:700;
    background:var(--gold); color:#241a02; white-space:nowrap;
  }
  .fleetrow button:disabled{background:#2a3557; color:var(--muted);}
  .empty{color:var(--muted); font-size:.8rem; text-align:center; padding:10px;}

  .toast{
    position:fixed; top:14px; left:50%; transform:translateX(-50%);
    background:var(--gold); color:#241a02; padding:9px 16px; border-radius:10px;
    font-size:.82rem; font-weight:700; opacity:0; transition:opacity .3s, top .3s; pointer-events:none; z-index:20;
    max-width:90vw; text-align:center;
  }
  .toast.show{opacity:1; top:26px;}

  .overlay{
    position:fixed; inset:0; background:rgba(3,8,14,.88); display:none;
    align-items:center; justify-content:center; z-index:30; padding:20px;
  }
  .overlay.show{display:flex;}
  .card{
    background:var(--panel); border:1px solid var(--line); border-radius:18px;
    padding:26px 22px; text-align:center; max-width:360px;
  }

<script>
const CX=150, CY=150, R_OUT=112, R_IN=70, R_MID=(112+70)/2;
const K = 0.5; // pacing global des revenus
const BASE_SPEED = 20; // degrés/seconde de base — un tour complet dure ~18s au lieu de ~5s
const OFFLINE_CAP_SEC = 7200;

const FISH_NAMES = ['Guppy','Tétra néon','Poisson rouge','Danio zébré','Poisson clown','Poisson-ange',
  'Poisson-papillon','Poisson-chirurgien','Poisson-lion','Poisson-globe','Mérou','Barracuda',
  'Requin-corail','Poulpe','Raie manta','Créature abyssale légendaire'];

const FISH_INFO = [
  { size:'2-4 cm', fact:"Petit poisson coloré, souvent le tout premier qu'on installe dans un aquarium." },
  { size:'3-5 cm', fact:'Bande fluorescente bleu et rouge, ne se déplace presque jamais seul.' },
  { size:'5-15 cm', fact:'Increvable et vorace, symbole des tout premiers bocaux de salon.' },
  { size:'4-6 cm', fact:'Rayures horizontales et nage nerveuse, star des laboratoires de recherche.' },
  { size:'7-11 cm', fact:"Vit collé à son anémone toute sa vie et ne la fuit jamais." },
  { size:'15-25 cm', fact:'Nageoires en voile, il glisse dans l\'eau plus qu\'il ne nage.' },
  { size:'12-20 cm', fact:'Museau fin taillé pour picorer entre les branches de corail.' },
  { size:'20-38 cm', fact:'Porte une lame tranchante et rétractable près de la queue.' },
  { size:'30-38 cm', fact:'Ses nageoires en éventail sont venimeuses au moindre contact.' },
  { size:'15-30 cm (jusqu\'à 60 gonflé)', fact:"Avale de l'eau pour doubler de volume face à un prédateur." },
  { size:'50 cm - 2 m', fact:'Peut avaler une proie presque aussi grosse que lui.' },
  { size:'60 cm - 1,8 m', fact:'Mâchoire acérée et pointe de vitesse pour chasser en embuscade.' },
  { size:'1 - 1,6 m', fact:'Timide malgré son nom, il préfère les fonds sableux le jour.' },
  { size:'0,3 - 3 m (bras compris)', fact:'Trois cœurs, du sang bleu, et une intelligence redoutable.' },
  { size:'3 - 7 m d\'envergure', fact:"Peut peser plus d'une tonne malgré son vol sous-marin très gracieux." },
  { size:'inconnue', fact:"Personne ne l'a jamais vue entière. On sait juste qu'elle brille dans le noir." },
];
function fishInfo(t){ return FISH_INFO[t-1] || { size:'hors normes', fact:'Une espèce si rare que même les carnets scientifiques restent muets à son sujet.' }; }

function rarityLabel(t){
  if (t<=3) return 'Commun';
  if (t<=6) return 'Peu commun';
  if (t<=9) return 'Rare';
  if (t<=12) return 'Épique';
  if (t<=15) return 'Légendaire';
  return 'Mythique';
}
function rarityColor(t){
  if (t<=3) return '#9fb6c4';
  if (t<=6) return '#4fd8c4';
  if (t<=9) return '#5b93e0';
  if (t<=12) return '#c77dff';
  if (t<=15) return '#ffcf6b';
  return '#ff6b9d';
}

// Système de maîtrise : 3 défis par espèce, indépendants des seeds du bassin
function masteryTarget(tier, level){
  if (level === 1) return 3; // posséder 3 simultanément
  if (level === 2) return Math.ceil(200 * tierValue(tier)); // perles générées par cette espèce
  return Math.max(5, 60 - tier*3); // fusions effectuées depuis ce palier
}
function masteryReward(level){ return level===3 ? 6 : level+1; }
function masteryProgress(tier, level){
  if (level === 1) return state.stats.maxSimultaneousByTier[tier] || 0;
  if (level === 2) return Math.floor(state.stats.coinsByTier[tier] || 0);
  return state.stats.fusionsByTier[tier] || 0;
}
function masteryDone(tier, level){
  return state.masteryUnlocked.includes(`${tier}_${level}`);
}
function isFullyMastered(tier){
  return masteryDone(tier,1) && masteryDone(tier,2) && masteryDone(tier,3);
}

function checkMastery(){
  for (let t=1; t<=16; t++){
    if (!state.compendium.includes(t)) continue;
    for (let lvl=1; lvl<=3; lvl++){
      const key = `${t}_${lvl}`;
      if (!state.masteryUnlocked.includes(key) && masteryProgress(t,lvl) >= masteryTarget(t,lvl)){
        state.masteryUnlocked.push(key);
        const reward = masteryReward(lvl);
        state.rarePearls += reward;
        showToast(`⭐ Maîtrise ${fishName(t)} niv.${lvl} ! +${reward} 💎`, 3200);
        if (lvl===3 && isFullyMastered(t)){
          state.rarePearls += 5;
          showToast(`🏅 Maître ${fishName(t)} ! +5 💎 bonus`, 3600);
        }
      }
    }
  }
}

const BIOMES = [
  {name:'Bassin tropical', sides:0, accent:'#4fd8c4', bg:'#0a3348'},
  {name:'Récif corallien', sides:3, accent:'#ff6b81', bg:'#3a1030'},
  {name:'Mangrove', sides:4, accent:'#7ec850', bg:'#16321a'},
  {name:'Forêt de kelp', sides:5, accent:'#3ddc97', bg:'#0f2e2a'},
  {name:'Pleine mer', sides:6, accent:'#2f7fe0', bg:'#081733'},
  {name:'Sources hydrothermales', sides:7, accent:'#ff8c42', bg:'#3a1808'},
  {name:'Polaire', sides:8, accent:'#bfe9f5', bg:'#0a2438'},
  {name:'Fosse abyssale', sides:9, accent:'#a06bff', bg:'#05060d'},
];

let state = null;
let dirty = false;
let lastFrame = null;
let oxygenActiveUntil = 0;
let oxygenCooldownUntil = 0;

function defaultState(){
  return {
    bassinIndex: 1,
    coins: 0,
    fish: [ {tier:1, t:0, type:'normal'}, {tier:1, t:0.5, type:'normal'} ],
    fishBoughtCount: 2,
    speedLevel: 0,
    feederValueLevel: 0,
    incomeMultLevel: 0,
    capacityLevel: 0,
    feeders: [ {t:0} ],
    unlocked: { feederBoost:false, capacity:false, specialization:false, oxygen:false, schooling:false },
    prestige: { bassinsCompleted:0, revenueMult:1, costMult:1 },
    bassinStartTime: Date.now(),
    compendium: [1],
    records: { bestBassinSeconds: null, biggestTier: 1 },
    streak: { count: 0, lastPlayDate: null },
    currentQuest: null,
    questsCompletedInBassin: 0,
    rarePearls: 0,
    meta: { speedLevel:0, startFishLevel:0, startFeederLevel:0, fuseDiscountLevel:0,
      bonusFuseChanceLevel:0, passiveIncomeLevel:0, fishCostDiscountLevel:0, oxygenDurationLevel:0, offlineMultLevel:0 },
    stats: { totalFusions:0, goldenCaught:0, totalFishBoughtLifetime:0, totalFeedersLifetime:0, oxygenUsedCount:0,
      fusionsByTier:{}, coinsByTier:{}, maxSimultaneousByTier:{} },
    discoveryDates: {},
    masteryUnlocked: [],
    achievementsUnlocked: [],
    nextGoldenEventAt: Date.now() + 20000,
    lastSave: Date.now(),
  };
}

const ACHIEVEMENTS = [
  { id:'first_fuse', name:'Première fusion', desc:'Réalise ta toute première fusion', reward:2, check:(s)=>s.stats.totalFusions>=1 },
  { id:'ten_fusions', name:'Chimiste amateur', desc:'Réalise 10 fusions au total', reward:3, check:(s)=>s.stats.totalFusions>=10 },
  { id:'palier10', name:'Grand fond', desc:'Fais évoluer un poisson jusqu\'au palier 10', reward:4, check:(s)=>s.records.biggestTier>=10 },
  { id:'full_compendium', name:'Naturaliste', desc:'Découvre les 16 espèces nommées', reward:6, check:(s)=>{
      for (let t=1;t<=16;t++) if (!s.compendium.includes(t)) return false; return true; } },
  { id:'five_bassins', name:'Habitué du bassin', desc:'Complète 5 bassins', reward:5, check:(s)=>s.prestige.bassinsCompleted>=5 },
  { id:'ten_bassins', name:'Aquariophile confirmé', desc:'Complète 10 bassins', reward:8, check:(s)=>s.prestige.bassinsCompleted>=10 },
  { id:'streak7', name:'Habitué de la maison', desc:'Joue 7 jours d\'affilée', reward:5, check:(s)=>s.streak.count>=7 },
  { id:'first_golden', name:'Chasseur de trésor', desc:'Attrape ton premier poisson doré', reward:3, check:(s)=>s.stats.goldenCaught>=1 },
  { id:'five_golden', name:'Pêche miraculeuse', desc:'Attrape 5 poissons dorés', reward:6, check:(s)=>s.stats.goldenCaught>=5 },
  { id:'fifty_fish', name:'Marchand de poissons', desc:'Achète 50 poissons au total', reward:4, check:(s)=>s.stats.totalFishBoughtLifetime>=50 },
  { id:'fifteen_feeders', name:'Architecte de bassin', desc:'Pose 15 mangeoires au total', reward:4, check:(s)=>s.stats.totalFeedersLifetime>=15 },
  { id:'twenty_oxygen', name:'Respiration profonde', desc:'Utilise la bulle d\'oxygène 20 fois', reward:4, check:(s)=>s.stats.oxygenUsedCount>=20 },
];

function checkAchievements(){
  for (const a of ACHIEVEMENTS){
    if (!state.achievementsUnlocked.includes(a.id) && a.check(state)){
      state.achievementsUnlocked.push(a.id);
      state.rarePearls += a.reward;
      showToast(`🏆 Haut fait : ${a.name} (+${a.reward} 💎)`, 3600);
    }
  }
}

const MAX_META_LEVEL = 5;
const UNLOCK_AT = { feederBoost:2, capacity:3, specialization:4, oxygen:5 };

function costMeta(level){ return 3 + level*3; }

function passiveIncomePerSec(){ return state.meta.passiveIncomeLevel * 0.4 * state.prestige.revenueMult; }
function offlineMult(){ return 1 + state.meta.offlineMultLevel*0.2; }
function oxygenDurationMs(){ return 8000 + state.meta.oxygenDurationLevel*2000; }

const META_UPGRADES = [
  { key:'speedLevel', name:'Vitesse permanente', desc:(l)=>`+${l*8}% courant, tous bassins` },
  { key:'startFishLevel', name:'Poissons de départ', desc:(l)=>`${2+l} poissons au lancement d'un bassin` },
  { key:'startFeederLevel', name:'Mangeoires de départ', desc:(l)=>`${1+l} mangeoire(s) au lancement d'un bassin` },
  { key:'fuseDiscountLevel', name:'Rabais de fusion', desc:(l)=>`-${l*5}% coût de fusion, tous bassins` },
  { key:'bonusFuseChanceLevel', name:'Fusion bonus', desc:(l)=>`${l*5}% de chance qu'une fusion donne palier +2` },
  { key:'passiveIncomeLevel', name:'Perles passives', desc:(l)=>`+${(l*0.4).toFixed(1)} 💠/s en continu, sans passage` },
  { key:'fishCostDiscountLevel', name:'Rabais poissons', desc:(l)=>`-${l*5}% coût d'achat des poissons, tous bassins` },
  { key:'oxygenDurationLevel', name:'Oxygène prolongé', desc:(l)=>`Bulle d'oxygène : ${8+l*2}s au lieu de 8s` },
  { key:'offlineMultLevel', name:'Gains hors-ligne', desc:(l)=>`+${l*20}% sur les gains pendant l'absence` },
];

function generateStartingFish(){
  const n = Math.min(5, 2 + state.meta.startFishLevel);
  const out = [];
  for (let i=0;i<n;i++) out.push({tier:1, t:i/n, type:'normal'});
  return out;
}
function generateStartingFeeders(){
  const n = Math.min(2, 1 + state.meta.startFeederLevel);
  const out = [];
  for (let i=0;i<n;i++) out.push({t:i/n});
  return out;
}

const QUESTS_PER_BASSIN = 3;

const QUEST_TYPES = [
  {
    type:'fuse',
    build:() => { const n = 1+Math.floor(Math.random()*2);
      return { target:n, reward:40, labelText:`Fusionne ${n} fois` }; }
  },
  {
    type:'buy',
    build:() => { const n = Math.max(2, Math.ceil(state.fish.length*0.45));
      return { target:n, reward:30, labelText:`Achète ${n} poissons` }; }
  },
  {
    type:'perles',
    // toujours ~20-35 secondes de revenu actuel, jamais trivial même très avancé
    build:() => { const secs = 20+Math.floor(Math.random()*15);
      const n = Math.max(20, Math.ceil(estIncomePerSec()*secs));
      return { target:n, reward:Math.ceil(n*0.35), labelText:`Gagne ${fmt(n)} 💠` }; }
  },
  {
    type:'reachtier',
    // pousse un poisson au-delà de ton meilleur palier actuel dans ce bassin
    build:() => { const best = state.fish.length ? Math.max(...state.fish.map(f=>f.tier)) : 1;
      const goal = Math.min(fusionTarget(), best+1);
      return { target:1, tierGoal:goal, reward:55, labelText:`Fais évoluer un poisson au palier ${goal} (${fishName(goal)})` }; }
  },
  {
    type:'simultaneous',
    // défi d'adresse/timing : faire coïncider 2 poissons sur la même mangeoire
    build:() => ({ target:1, reward:50, labelText:`Fais passer 2 poissons sur la même mangeoire en même temps` })
  },
];

function startNewQuest(){
  const q = QUEST_TYPES[Math.floor(Math.random()*QUEST_TYPES.length)];
  const built = q.build();
  state.currentQuest = { type: q.type, target: built.target, tierGoal: built.tierGoal, progress: 0, claimed:false, reward: built.reward, labelText: built.labelText };
}

function todayStr(){
  const d = new Date();
  return `${d.getFullYear()}-${d.getMonth()+1}-${d.getDate()}`;
}

function updateStreak(){
  const today = todayStr();
  const s = state.streak;
  if (s.lastPlayDate !== today){
    const y = new Date(Date.now() - 86400000);
    const yStr = `${y.getFullYear()}-${y.getMonth()+1}-${y.getDate()}`;
    const wasPlayingBefore = s.lastPlayDate !== null;
    s.count = (s.lastPlayDate === yStr) ? s.count+1 : 1;
    s.lastPlayDate = today;
    if (wasPlayingBefore){
      const bonusCoins = 20 + s.count*8;
      const bonusPearls = (s.count % 3 === 0) ? 1 : 0;
      state.coins += bonusCoins;
      state.rarePearls += bonusPearls;
      showToast(`🔥 Jour ${s.count} ! Bonus de connexion : +${bonusCoins} 💠${bonusPearls?' +1 💎':''}`, 3600);
    }
  }
}

function checkBassinCompletable(){
  const hasTargetFish = state.fish.some(f=>f.tier >= fusionTarget());
  const questsOk = state.questsCompletedInBassin >= QUESTS_PER_BASSIN;
  if (hasTargetFish && questsOk){
    completeBassin();
    return true;
  }
  return false;
}

function questProgress(kind, amount){
  const q = state.currentQuest;
  if (!q || q.type !== kind || q.claimed) return;
  q.progress += amount;
  if (q.progress >= q.target){
    q.progress = q.target;
    q.claimed = true;
    state.coins += q.reward;
    state.rarePearls += 1;
    state.questsCompletedInBassin++;
    showToast(`Quête accomplie ! +${q.reward} 💠 +1 💎 (${state.questsCompletedInBassin}/${QUESTS_PER_BASSIN})`);
    startNewQuest();
    checkBassinCompletable();
  }
}

function discoverTier(t){
  if (!state.compendium.includes(t)){
    state.compendium.push(t);
    state.compendium.sort((a,b)=>a-b);
    state.rarePearls += 1;
    state.discoveryDates[t] = Date.now();
    showToast(`Nouvelle espèce découverte : ${fishName(t)} ! +1 💎`);
  }
  if (t > state.records.biggestTier) state.records.biggestTier = t;
}

function formatDuration(sec){
  if (sec == null) return '—';
  const m = Math.floor(sec/60), s = Math.round(sec%60);
  return m>0 ? `${m}min ${s}s` : `${s}s`;
}

function biomeFor(bassinIndex){
  const idx = bassinIndex-1;
  if (idx < BIOMES.length) return Object.assign({}, BIOMES[idx]);
  const extra = idx - (BIOMES.length-1);
  const base = BIOMES[BIOMES.length-1];
  return { name: `Abysses mythiques ${extra}`, sides: 9+extra, accent: base.accent, bg: base.bg };
}

function fishName(t){
  if (t <= FISH_NAMES.length) return FISH_NAMES[t-1];
  return `Espèce légendaire n°${t-FISH_NAMES.length}`;
}
function tierValue(t){ return Math.pow(3, t-1); }
function fishHue(t){ return (170 + t*20) % 360; }
function fishColor(t){
  if (t===13) return '#7c8ba0';
  if (t===14) return '#b05fd6';
  if (t===15) return '#5b93e0';
  if (t>=16) return '#2c2350';
  return `hsl(${fishHue(t)} 70% 58%)`;
}
function fishColorLight(t){
  if (t===13) return '#aeb9c8';
  if (t===14) return '#dba8ef';
  if (t===15) return '#a9cdf5';
  if (t>=16) return '#5d4894';
  return `hsl(${fishHue(t)} 78% 78%)`;
}

function typeSpeedMult(type){ return type==='fast' ? 1.55 : type==='slow' ? 0.6 : 1; }
function typeValueMult(type){ return type==='fast' ? 0.6 : type==='slow' ? 1.65 : 1; }
function typeLabel(type){ return type==='fast' ? '⚡ rapide' : type==='slow' ? '🐢 lent' : ''; }

function fusionTarget(){ return 3 + state.bassinIndex; }

function angleSpeedBase(){
  const boosted = Date.now() < oxygenActiveUntil ? 2 : 1;
  const metaSpeed = 1 + state.meta.speedLevel*0.08;
  return BASE_SPEED * (1 + state.speedLevel*0.2) * metaSpeed * boosted;
}

function costFish(){
  const discount = 1 - state.meta.fishCostDiscountLevel*0.05;
  return Math.ceil(8 * Math.pow(1.15, state.fishBoughtCount) * state.prestige.costMult * discount);
}
function costSpeed(){ return Math.ceil(28 * Math.pow(1.45, state.speedLevel) * state.prestige.costMult); }
function costFeederBoost(){ return Math.ceil(45 * Math.pow(1.55, state.feederValueLevel) * state.prestige.costMult); }
function costIncomeMult(){ return Math.ceil(70 * Math.pow(1.9, state.incomeMultLevel) * state.prestige.costMult); }
const MAX_CAPACITY_PER_BASSIN = 3;
function costCapacity(){ return Math.ceil(500 * Math.pow(3.2, state.capacityLevel)); }
function costNewFeeder(){ return Math.ceil(180 * Math.pow(2.2, state.feeders.length-1) * state.prestige.costMult); }
function costFuse(t){
  const fuseDiscount = 1 - state.meta.fuseDiscountLevel*0.05;
  return Math.ceil(35 * Math.pow(2.3, t-1) * fuseDiscount);
}
function maxFish(){ return Math.min(40, 10 + state.bassinIndex*2 + state.capacityLevel*2); }
function maxFeeders(){ const b = biomeFor(state.bassinIndex); return b.sides===0 ? 8 : Math.min(12, b.sides*2); }

function feederValue(){ return (1 + state.feederValueLevel*0.3) * state.prestige.revenueMult; }
function incomeMult(){ return 1 + state.incomeMultLevel*0.12; }

function checkUnlocks(){
  const u = state.unlocked;
  if (state.bassinIndex >= 2) u.feederBoost = true;
  if (state.bassinIndex >= 3) u.capacity = true;
  if (state.bassinIndex >= 4) u.specialization = true;
  if (state.bassinIndex >= 5) u.oxygen = true;
  if (state.bassinIndex >= 6) u.schooling = true;
}

function showToast(msg, duration){
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.add('show');
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=> el.classList.remove('show'), duration || 2600);
}

function fmt(n){
  if (n < 1000) return (Math.round(n*10)/10).toString();
  const units = ['k','M','G','T','P'];
  let u = -1;
  while (n >= 1000 && u < units.length-1){ n/=1000; u++; }
  return n.toFixed(n<10?2:1) + units[u];
}

// ---- geometry ----
function polygonVertices(sides, radius, rotationDeg){
  const pts = [];
  for (let i=0;i<sides;i++){
    const a = (rotationDeg + i*(360/sides) - 90) * Math.PI/180;
    pts.push({x: CX+radius*Math.cos(a), y: CY+radius*Math.sin(a)});
  }
  return pts;
}
function positionAtT(t, sides, radius, rotationDeg){
  t = ((t % 1)+1)%1;
  if (sides === 0){
    const angle = t*360;
    const rad = (angle-90)*Math.PI/180;
    return { x: CX+radius*Math.cos(rad), y: CY+radius*Math.sin(rad), heading: angle };
  }
  const verts = polygonVertices(sides, radius, rotationDeg);
  const seg = t*sides;
  const i = Math.floor(seg) % sides;
  const u = seg - Math.floor(seg);
  const p0 = verts[i], p1 = verts[(i+1)%sides];
  const x = p0.x + (p1.x-p0.x)*u;
  const y = p0.y + (p1.y-p0.y)*u;
  const heading = Math.atan2(p1.y-p0.y, p1.x-p0.x) * 180/Math.PI;
  return { x, y, heading };
}
function pointsAttr(sides, radius, rotationDeg){
  if (sides === 0) return null;
  return polygonVertices(sides, radius, rotationDeg).map(p=>`${p.x},${p.y}`).join(' ');
}

function crossedT(prev, next, target){
  if (next >= prev) return target > prev && target <= next;
  return target > prev || target <= next;
}

// ---- simulation ----
function simulate(dt){
  const spdBase = angleSpeedBase()/360; // fraction de tour / seconde de base
  const crossingsThisTick = {};
  for (const f of state.fish){
    const prev = f.t;
    const spd = spdBase * typeSpeedMult(f.type);
    let next = (prev + spd*dt) % 1;
    for (let fi=0; fi<state.feeders.length; fi++){
      if (crossedT(prev, next, state.feeders[fi].t)){
        if (!crossingsThisTick[fi]) crossingsThisTick[fi] = [];
        crossingsThisTick[fi].push(f);
      }
    }
    f.t = next;
  }
  let earned = 0;
  const biome = biomeFor(state.bassinIndex);
  const GOLDEN_MULT = 15;
  for (const fi in crossingsThisTick){
    const group = crossingsThisTick[fi];
    const schoolBonus = state.unlocked.schooling && group.length > 1 ? (1 + 0.25*(group.length-1)) : 1;
    let groupEarned = 0;
    for (const f of group){
      let base = tierValue(f.tier) * typeValueMult(f.type) * feederValue() * incomeMult() * K * schoolBonus;
      if (f.golden){
        base *= GOLDEN_MULT;
        f.golden = false;
        state.stats.goldenCaught++;
        state.nextGoldenEventAt = Date.now() + 30000 + Math.random()*40000;
        showToast(`✨ Poisson doré attrapé ! +${fmt(base)} 💠`, 2800);
        buildFishLayer();
      }
      groupEarned += base;
      state.stats.coinsByTier[f.tier] = (state.stats.coinsByTier[f.tier]||0) + base;
    }
    earned += groupEarned;
    if (group.length > 1) questProgress('simultaneous', 1);
    const feeder = state.feeders[fi];
    if (feeder){
      const p = positionAtT(feeder.t, biome.sides, R_OUT+12, 0);
      spawnPopup(p.x, p.y, groupEarned);
      spawnRipple(p.x, p.y, biome.accent);
    }
  }
  if (earned > 0){ state.coins += earned; questProgress('perles', earned); }

  const passive = passiveIncomePerSec() * dt;
  if (passive > 0){ state.coins += passive; questProgress('perles', passive); }
}

function spawnRipple(x, y, color){
  const layer = document.getElementById('popupLayer');
  if (!layer) return;
  const el = document.createElementNS('http://www.w3.org/2000/svg','circle');
  el.setAttribute('cx', x);
  el.setAttribute('cy', y);
  el.setAttribute('r', 5);
  el.setAttribute('fill', 'none');
  el.setAttribute('stroke', color);
  el.setAttribute('stroke-width', 2);
  layer.appendChild(el);
  el.animate(
    [ {r:'5', opacity:1}, {r:'20', opacity:0} ],
    { duration: 500, easing: 'ease-out' }
  );
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 520);
}

function spawnPopup(x, y, amount){
  const layer = document.getElementById('popupLayer');
  if (!layer) return;
  const el = document.createElementNS('http://www.w3.org/2000/svg','text');
  el.setAttribute('x', x);
  el.setAttribute('y', y);
  el.setAttribute('fill', '#ffcf6b');
  el.setAttribute('font-size', '11');
  el.setAttribute('font-weight', '700');
  el.setAttribute('text-anchor', 'middle');
  el.textContent = '+' + fmt(amount) + ' 💠';
  layer.appendChild(el);
  el.animate(
    [ {transform:'translateY(0px)', opacity:1}, {transform:'translateY(-26px)', opacity:0} ],
    { duration: 900, easing: 'ease-out' }
  );
  setTimeout(() => { if (el.parentNode) el.parentNode.removeChild(el); }, 920);
}

function estIncomePerSec(){
  const loopsPerSec = angleSpeedBase()/360;
  const feedSum = state.feeders.length * feederValue();
  const fishSum = state.fish.reduce((s,f)=> s + tierValue(f.tier)*typeValueMult(f.type)*typeSpeedMult(f.type), 0);
  return loopsPerSec * feedSum * fishSum * incomeMult() * K + passiveIncomePerSec();
}

// ---- rendering ----

  if (wrap) wrap.style.background = `linear-gradient(180deg, ${biome.bg} 0%, #04070c 100%)`;

    <path d="M36,296 Q30,268 41,243 Q27,222 39,198" stroke="#3ddc97" stroke-width="3" fill="none" stroke-linecap="round"/>
    <path d="M276,293 Q282,264 269,239 Q284,216 270,192" stroke="#2fae6b" stroke-width="4" fill="none" stroke-linecap="round"/>

  } else {
    html += `<polygon points="${pointsAttr(biome.sides,R_OUT,0)}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
    html += `<polygon points="${pointsAttr(biome.sides,R_IN,0)}" fill="none" stroke="${biome.accent}" stroke-width="2" opacity="0.6"/>`;
  }
  state.feeders.forEach((fdr) => {
    const pIn = positionAtT(fdr.t, biome.sides, R_IN, 0);
    const pOut = positionAtT(fdr.t, biome.sides, R_OUT, 0);
    html += `<line class="feeder-line" x1="${pIn.x}" y1="${pIn.y}" x2="${pOut.x}" y2="${pOut.y}" stroke="${biome.accent}" stroke-width="1.5" opacity="0.7"/>`;
    const mid = positionAtT(fdr.t, biome.sides, R_OUT+12, 0);
    html += `<g class="feederGlow">
      <circle cx="${mid.x}" cy="${mid.y}" r="9" fill="${biome.accent}" opacity="0.16"/>

    </g>`;

  svg.innerHTML = html;
  buildFishLayer();
}

function fishMarkup(f, size){
  const t = f.tier;
  const c = f.golden ? '#ffd700' : fishColor(t);
  const cl = f.golden ? '#fff3b0' : fishColorLight(t);
  if (t === 14) return octopusMarkup(size, c, cl);
  if (t === 15) return rayMarkup(size, c, cl);
  if (t === 13) return sharkMarkup(size, c, cl);
  if (t >= 16) return abyssalMarkup(size, c, cl);
  return standardFishMarkup(t, size, c, cl);
}

function standardFishMarkup(t, size, c, cl){
  let extra = '';
  let finScale = 1;
  if (t >= 5 && t <= 8){
    // bande "clown/papillon" : rayure claire sur le corps
    extra += `<rect x="${-size*0.25}" y="${-size*0.9}" width="${size*0.32}" height="${size*1.8}" fill="#ffffff" opacity="0.5" rx="${size*0.14}"/>`;
  }
  if (t >= 9 && t <= 12){
    // bande "fantaisie" : nageoires plus amples
    finScale = 1.55;
    extra += `<polygon points="${-size*0.2},${size*0.75} ${size*0.05},${size*1.25} ${size*0.3},${size*0.7}" fill="${c}" opacity="0.85"/>`;
  }
  return `
    <ellipse cx="${-size*0.15}" cy="${size*0.32}" rx="${size*1.05}" ry="${size*0.4}" fill="${cl}" opacity="0.5"/>
    <path d="M ${-size*1.6},0 C ${-size*1.6},${-size*0.95} ${size*0.55},${-size*0.95} ${size*1.15},0 C ${size*0.55},${size*0.95} ${-size*1.6},${size*0.95} ${-size*1.6},0 Z" fill="${c}"/>
    ${extra}
    <polygon points="${-size*0.3},${-size*0.85*finScale} ${size*0.15},${-size*1.35*finScale} ${size*0.35},${-size*0.75*finScale}" fill="${c}" opacity="0.9"/>
    <g transform="translate(${-size*1.55},0)">
      <polygon points="0,0 ${-size*0.9},${-size*0.65} ${-size*0.9},${size*0.65}" fill="${c}">
        <animateTransform attributeName="transform" type="rotate" values="-16 0 0;16 0 0;-16 0 0" dur="0.55s" repeatCount="indefinite"/>
      </polygon>
    </g>
    <ellipse cx="${size*0.1}" cy="${-size*0.35}" rx="${size*0.5}" ry="${size*0.22}" fill="#ffffff" opacity="0.3"/>
    <ellipse cx="${-size*0.5}" cy="${-size*0.15}" rx="${size*0.18}" ry="${size*0.09}" fill="#ffffff" opacity="0.18"/>
    <circle cx="${size*0.65}" cy="${-size*0.12}" r="${Math.max(1,size*0.13)}" fill="#04211c"/>
  `;
}

function sharkMarkup(size, c, cl){
  return `
    <ellipse cx="${-size*0.1}" cy="${size*0.3}" rx="${size*1.1}" ry="${size*0.38}" fill="${cl}" opacity="0.5"/>
    <path d="M ${-size*1.7},0 C ${-size*1.7},${-size*0.8} ${size*0.9},${-size*0.55} ${size*1.5},0 C ${size*0.9},${size*0.7} ${-size*1.7},${size*0.8} ${-size*1.7},0 Z" fill="${c}"/>
    <polygon points="${-size*0.15},${-size*0.8} ${size*0.05},${-size*1.7} ${size*0.4},${-size*0.7}" fill="${c}"/>
    <path d="M ${-size*1.65},0 Q ${-size*2.15},${-size*0.55} ${-size*2.05},0 Q ${-size*2.15},${size*0.55} ${-size*1.65},0 Z" fill="${c}"/>
    <circle cx="${size*0.85}" cy="${-size*0.1}" r="${Math.max(1,size*0.1)}" fill="#04211c"/>
  `;
}

function octopusMarkup(size, c, cl){
  let tentacles = '';
  for (let i=0;i<5;i++){
    const a = -55 + i*27;
    const rad = a*Math.PI/180;
    const tx = Math.cos(rad)*size*1.5, ty = size*0.9 + Math.sin(rad)*size*0.5;
    tentacles += `<path d="M0,${size*0.6} Q ${tx*0.5},${size*1.3} ${tx},${ty}" stroke="${c}" stroke-width="${size*0.32}" fill="none" stroke-linecap="round">
      <animate attributeName="d" dur="${1+i*0.1}s" repeatCount="indefinite"
        values="M0,${size*0.6} Q ${tx*0.5},${size*1.3} ${tx},${ty};M0,${size*0.6} Q ${tx*0.6},${size*1.1} ${tx*0.9},${ty*0.8};M0,${size*0.6} Q ${tx*0.5},${size*1.3} ${tx},${ty}"/>
    </path>`;
  }
  return `
    ${tentacles}
    <ellipse cx="0" cy="${-size*0.1}" rx="${size*1.15}" ry="${size*0.95}" fill="${c}"/>
    <ellipse cx="${-size*0.25}" cy="${-size*0.35}" rx="${size*0.5}" ry="${size*0.35}" fill="${cl}" opacity="0.5"/>
    <circle cx="${size*0.35}" cy="${-size*0.3}" r="${size*0.16}" fill="#04211c"/>
    <circle cx="${-size*0.25}" cy="${-size*0.3}" r="${size*0.16}" fill="#04211c"/>
  `;
}

function rayMarkup(size, c, cl){
  return `
    <polygon points="0,${-size*0.3} ${size*1.5},${size*0.5} 0,${size*1.15} ${-size*1.5},${size*0.5}" fill="${c}">
      <animateTransform attributeName="transform" type="scale" values="1,0.85;1,1.05;1,0.85" dur="1.4s" repeatCount="indefinite" additive="sum"/>
    </polygon>
    <ellipse cx="0" cy="${size*0.1}" rx="${size*0.4}" ry="${size*0.3}" fill="${cl}" opacity="0.6"/>
    <path d="M0,${size*1.1} Q ${size*0.3},${size*1.6} 0,${size*2}" stroke="${c}" stroke-width="${size*0.14}" fill="none" stroke-linecap="round"/>
    <circle cx="${-size*0.2}" cy="${-size*0.05}" r="${Math.max(1,size*0.09)}" fill="#04211c"/>
    <circle cx="${size*0.2}" cy="${-size*0.05}" r="${Math.max(1,size*0.09)}" fill="#04211c"/>
  `;
}

function abyssalMarkup(size, c, cl){
  const dots = [[-size*0.9,0],[-size*0.3,size*0.5],[size*0.4,-size*0.4],[size*0.9,size*0.2]]
    .map(([x,y],i) => `<circle cx="${x}" cy="${y}" r="${size*0.09}" fill="${cl}">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="${1.2+i*0.3}s" repeatCount="indefinite"/>
    </circle>`).join('');
  return `
    <path d="M ${-size*1.7},0 C ${-size*1.7},${-size*1.05} ${size*0.6},${-size*1.05} ${size*1.25},0 C ${size*0.6},${size*1.05} ${-size*1.7},${size*1.05} ${-size*1.7},0 Z" fill="${c}"/>
    <g transform="translate(${-size*1.65},0)">
      <polygon points="0,0 ${-size*1.0},${-size*0.7} ${-size*1.0},${size*0.7}" fill="${c}">
        <animateTransform attributeName="transform" type="rotate" values="-12 0 0;12 0 0;-12 0 0" dur="0.8s" repeatCount="indefinite"/>
      </polygon>
    </g>
    ${dots}
    <circle cx="${size*0.7}" cy="${-size*0.1}" r="${Math.max(1,size*0.14)}" fill="#ffe27a">
      <animate attributeName="opacity" values="0.5;1;0.5" dur="1.5s" repeatCount="indefinite"/>
    </circle>
  `;
}

function buildFishLayer(){
  const layer = document.getElementById('fishLayer');
  layer.innerHTML = '';
  state.fish.forEach((f, i) => {
    const g = document.createElementNS('http://www.w3.org/2000/svg','g');
    g.setAttribute('id','fish'+i);
    g.setAttribute('class','fish');
    const size = 6 + Math.min(7, f.tier*0.5);
    const delay = (i % 7) * -0.31;
    const dur = 2.1 + (i % 5)*0.18;
    g.innerHTML = `<g class="fishSway" style="animation-delay:${delay}s; animation-duration:${dur}s;">${fishMarkup(f, size)}</g>`;
    layer.appendChild(g);
  });
  positionFish();
}

function positionFish(){
  const biome = biomeFor(state.bassinIndex);
  state.fish.forEach((f,i) => {
    const el = document.getElementById('fish'+i);
    if (!el) return;
    const p = positionAtT(f.t, biome.sides, R_MID, 0);
    el.setAttribute('transform', `translate(${p.x},${p.y}) rotate(${p.heading})`);
    el.classList.toggle('golden', !!f.golden);
  });
}

function tickGoldenEvent(){
  const hasGolden = state.fish.some(f=>f.golden);
  if (hasGolden) return;
  if (Date.now() < state.nextGoldenEventAt) return;
  if (state.fish.length === 0) return;
  const idx = Math.floor(Math.random()*state.fish.length);
  state.fish[idx].golden = true;
  state.fish[idx].goldenUntil = Date.now() + 14000;
  showToast('✨ Un poisson doré apparaît ! Fais-le passer devant une mangeoire vite !', 3200);
  buildFishLayer();
}

function expireGoldenIfNeeded(){
  let changed = false;
  for (const f of state.fish){
    if (f.golden && Date.now() > f.goldenUntil){
      f.golden = false;
      changed = true;
    }
  }
  if (changed){
    state.nextGoldenEventAt = Date.now() + 30000 + Math.random()*40000;
    buildFishLayer();
  }
}

function findFusableGroup(){
  const groups = {};
  for (const f of state.fish){
    const key = f.tier+'_'+f.type;
    if (!groups[key]) groups[key] = { tier:f.tier, type:f.type, count:0 };
    groups[key].count++;
  }
  const keys = Object.keys(groups).filter(k=>groups[k].count>=3).sort((a,b)=>groups[a].tier-groups[b].tier);
  return keys.length ? groups[keys[0]] : null;
}

function doAutoFuse(){
  const g = findFusableGroup();
  if (!g){ showToast('Pas assez de poissons identiques pour fusionner (3 minimum)'); return; }
  const ok = fuseGroup(g.tier, g.type);
  if (!ok) showToast('Pas assez de perles pour cette fusion');
}

function renderFleet(){

// ---- actions ----
function buyFish(type){
  if (state.fish.length >= maxFish()) return;
  const c = costFish();
  if (state.coins < c) return;
  state.coins -= c;
  state.fishBoughtCount++;
  state.stats.totalFishBoughtLifetime++;
  state.fish.push({tier:1, t: Math.random(), type: state.unlocked.specialization ? type : 'normal'});
  questProgress('buy', 1);
  dirty = true;
  buildTankStatic();
  render();
}

function buySpeed(){
  const c = costSpeed();
  if (state.coins < c) return;
  state.coins -= c;
  state.speedLevel++;
  dirty = true;
  render();
}

function buyFeederBoost(){
  const c = costFeederBoost();
  if (state.coins < c) return;
  state.coins -= c;
  state.feederValueLevel++;
  dirty = true;
  render();
}

function buyIncomeMult(){
  const c = costIncomeMult();
  if (state.coins < c) return;
  state.coins -= c;
  state.incomeMultLevel++;
  dirty = true;
  render();
}

function buyCapacity(){
  if (maxFish() >= 40 || state.capacityLevel >= MAX_CAPACITY_PER_BASSIN) return;
  const c = costCapacity();
  if (state.coins < c) return;
  state.coins -= c;
  state.capacityLevel++;
  dirty = true;
  render();
}

function addFeeder(){
  if (state.feeders.length >= maxFeeders()) return;
  const c = costNewFeeder();
  if (state.coins < c) return;
  state.coins -= c;
  const ts = state.feeders.map(f=>f.t).sort((a,b)=>a-b);
  const all = ts.concat([ts[0]+1]);
  let bestGap = -1, bestMid = 0;
  for (let i=1;i<all.length;i++){
    const gap = all[i]-all[i-1];
    if (gap > bestGap){ bestGap = gap; bestMid = (all[i-1]+all[i])/2; }
  }
  state.feeders.push({t: bestMid % 1});
  state.stats.totalFeedersLifetime++;
  dirty = true;
  buildTankStatic();
  render();
}

function fuseGroup(tier, type){
  const idxs = [];
  for (let i=0;i<state.fish.length && idxs.length<3;i++){
    if (state.fish[i].tier===tier && state.fish[i].type===type) idxs.push(i);
  }
  if (idxs.length < 3) return false;
  const c = costFuse(tier);
  if (state.coins < c) return false;
  state.coins -= c;
  const avgT = idxs.reduce((s,i)=>s+state.fish[i].t,0)/idxs.length;
  state.fish = state.fish.filter((_,i)=>!idxs.includes(i));
  let newTier = tier+1;
  if (Math.random() < state.meta.bonusFuseChanceLevel*0.05){
    newTier = tier+2;
    showToast('🎉 Fusion bonus ! Palier +2 d\'un coup !', 2400);
  }
  state.fish.push({tier:newTier, t:avgT, type});
  state.stats.totalFusions++;
  state.stats.fusionsByTier[tier] = (state.stats.fusionsByTier[tier]||0) + 1;
  questProgress('fuse', 1);
  if (state.currentQuest && state.currentQuest.type === 'reachtier' && newTier >= state.currentQuest.tierGoal){
    questProgress('reachtier', 1);
  }
  discoverTier(newTier);
  dirty = true;
  if (newTier >= fusionTarget()){
    if (!checkBassinCompletable()){
      const remaining = QUESTS_PER_BASSIN - state.questsCompletedInBassin;
      showToast(`Palier atteint ! Encore ${remaining} quête(s) à valider pour passer au bassin suivant`);
      buildTankStatic();
      render();
    }
  } else {
    buildTankStatic();
    render();
  }
  return true;
}

function useOxygen(){
  if (Date.now() < oxygenCooldownUntil) return;
  oxygenActiveUntil = Date.now() + oxygenDurationMs();
  oxygenCooldownUntil = Date.now() + 30000;
  state.stats.oxygenUsedCount++;
  showToast("Bulle d'oxygène activée !");
  render();
}

function completeBassin(){
  const elapsed = (Date.now() - state.bassinStartTime) / 1000;
  let recordText = '';
  if (state.records.bestBassinSeconds === null || elapsed < state.records.bestBassinSeconds){
    state.records.bestBassinSeconds = elapsed;
    recordText = ' — nouveau record de vitesse !';
  }
  const pearlsGained = 3;
  state.rarePearls += pearlsGained;
  state.prestige.bassinsCompleted++;
  state.prestige.revenueMult = 1 + 0.1*state.prestige.bassinsCompleted;
  state.prestige.costMult = Math.max(0.5, 1 - 0.03*state.prestige.bassinsCompleted);
  document.getElementById('overlayTitle').textContent = 'Bassin complété !';
  document.getElementById('overlaySub').textContent = `Bouclé en ${formatDuration(elapsed)}${recordText} +${pearlsGained} 💎 Vous passez au bassin ${state.bassinIndex+1}.`;
  document.getElementById('overlayBonus').textContent = `Revenu global x${state.prestige.revenueMult.toFixed(2)}, coûts x${state.prestige.costMult.toFixed(2)}`;
  document.getElementById('overlay').classList.add('show');
  saveState();
}

function startNewBassin(){
  state.bassinIndex++;
  state.coins = 0;
  state.fish = generateStartingFish();
  state.fishBoughtCount = state.fish.length;
  state.speedLevel = 0;
  state.feederValueLevel = 0;
  state.incomeMultLevel = 0;
  state.capacityLevel = 0;
  state.feeders = generateStartingFeeders();
  state.bassinStartTime = Date.now();
  state.questsCompletedInBassin = 0;
  startNewQuest();
  checkUnlocks();
  document.getElementById('overlay').classList.remove('show');
  dirty = true;
  buildTankStatic();
  render();
  saveState();
}

// ---- loop / persistence ----
function loop(ts){
  if (lastFrame === null) lastFrame = ts;
  let dt = (ts-lastFrame)/1000;
  dt = Math.min(dt, 0.25);
  lastFrame = ts;
  simulate(dt);
  positionFish();
  requestAnimationFrame(loop);
}

let tickCounter = 0;
function updateMaxSimultaneous(){
  const counts = {};
  for (const f of state.fish) counts[f.tier] = (counts[f.tier]||0) + 1;
  for (const t in counts){
    if (counts[t] > (state.stats.maxSimultaneousByTier[t]||0)) state.stats.maxSimultaneousByTier[t] = counts[t];
  }
}

function uiTick(){
  tickCounter++;
  expireGoldenIfNeeded();
  tickGoldenEvent();
  updateMaxSimultaneous();
  checkAchievements();
  checkMastery();
  render();
  dirty = true;
  if (tickCounter % 3 === 0){ saveState(); }
}

async function storageSet(key, value){
  try{
    if (window.storage && window.storage.set){
      const r = await window.storage.set(key, value, false);
      if (r) return true;
    }
  }catch(err){ /* pas d'accès à window.storage ici, on bascule sur localStorage */ }
  try{ localStorage.setItem(key, value); return true; }catch(err){ return false; }
}

async function storageGet(key){
  try{
    if (window.storage && window.storage.get){
      const r = await window.storage.get(key, false);
      if (r && r.value) return r.value;
    }
  }catch(err){ /* pas d'accès à window.storage ici, on bascule sur localStorage */ }
  try{ return localStorage.getItem(key); }catch(err){ return null; }
}

async function saveState(){
  state.lastSave = Date.now();
  await storageSet('aquarium-idle-save', JSON.stringify(state));
}

async function loadState(){
  try{
    const raw = await storageGet('aquarium-idle-save');
    if (raw){
      const loaded = JSON.parse(raw);
      state = Object.assign(defaultState(), loaded);
      state.unlocked = Object.assign(defaultState().unlocked, loaded.unlocked||{});
      state.prestige = Object.assign(defaultState().prestige, loaded.prestige||{});
      state.records = Object.assign(defaultState().records, loaded.records||{});
      state.streak = Object.assign(defaultState().streak, loaded.streak||{});
      state.meta = Object.assign(defaultState().meta, loaded.meta||{});
      state.stats = Object.assign(defaultState().stats, loaded.stats||{});
      state.stats.fusionsByTier = loaded.stats && loaded.stats.fusionsByTier || {};
      state.stats.coinsByTier = loaded.stats && loaded.stats.coinsByTier || {};
      state.stats.maxSimultaneousByTier = loaded.stats && loaded.stats.maxSimultaneousByTier || {};
      state.discoveryDates = loaded.discoveryDates || {};
      state.masteryUnlocked = loaded.masteryUnlocked || [];
      state.achievementsUnlocked = loaded.achievementsUnlocked || [];
      state.nextGoldenEventAt = loaded.nextGoldenEventAt || (Date.now() + 20000);
      state.rarePearls = loaded.rarePearls || 0;
      state.compendium = loaded.compendium || [1];
      state.bassinStartTime = loaded.bassinStartTime || Date.now();
      const elapsedSec = Math.max(0, Math.min(OFFLINE_CAP_SEC, (Date.now()-(loaded.lastSave||Date.now()))/1000));
      if (elapsedSec > 5){
        const earned = estIncomePerSec()*elapsedSec*offlineMult();
        state.coins += earned;
        showToast(`Pendant votre absence : +${fmt(earned)} 💠`);
      }
    } else {
      state = defaultState();
    }
  }catch(err){
    state = defaultState();
  }
  checkUnlocks();
  updateStreak();
  if (state.questsCompletedInBassin == null) state.questsCompletedInBassin = 0;
  if (!state.currentQuest) startNewQuest();
}

}

  document.getElementById('fuseBtn').onclick = doAutoFuse;
  document.getElementById('buyNormalBtn').onclick = () => buyFish('normal');
  document.getElementById('buyFastBtn').onclick = () => buyFish('fast');
  document.getElementById('buySlowBtn').onclick = () => buyFish('slow');
  document.getElementById('speedBtn').onclick = buySpeed;
  document.getElementById('incomeMultBtn').onclick = buyIncomeMult;
  document.getElementById('addFeederBtn').onclick = addFeeder;
  document.getElementById('feederBoostBtn').onclick = buyFeederBoost;
  document.getElementById('capacityBtn').onclick = buyCapacity;
  document.getElementById('oxygenBtn').onclick = useOxygen;
  document.getElementById('overlayBtn').onclick = startNewBassin;
  document.getElementById('journalBtn').onclick = openJournal;
  document.getElementById('questText').onclick = () => { openJournal(); switchJournalTab('quests'); };
  document.getElementById('tabQuestsBtn').onclick = () => switchJournalTab('quests');
  document.getElementById('journalCloseBtn').onclick = () => {
    document.getElementById('journalOverlay').classList.remove('show');
  };
  document.getElementById('tabCompendiumBtn').onclick = () => switchJournalTab('compendium');
  document.getElementById('tabRecordsBtn').onclick = () => switchJournalTab('records');
  document.getElementById('tabFleetBtn').onclick = () => switchJournalTab('fleet');
  document.getElementById('tabMetaBtn').onclick = () => switchJournalTab('meta');
  document.getElementById('resetBtn').onclick = () => {
    if (confirm('Réinitialiser toute la progression, y compris les bonus de prestige, le compendium et les records ?')){
      state = defaultState();
      dirty = true;
      buildTankStatic();
      render();
      saveState();
    }
  };

  requestAnimationFrame(loop);
  setInterval(uiTick, 1000);
}

init();
</script>
</body>
</html>
